name: Deploy to InfinityFree

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync source files into htdocs package
        run: |
          mkdir -p outputs/infinityfree-htdocs-package/htdocs
          rsync -a --delete --exclude='assets/uploads/' public/ outputs/infinityfree-htdocs-package/htdocs/
          rsync -a --delete app/ outputs/infinityfree-htdocs-package/htdocs/app/
          rsync -a --delete bootstrap/ outputs/infinityfree-htdocs-package/htdocs/bootstrap/
          rsync -a --delete config/ outputs/infinityfree-htdocs-package/htdocs/config/
          rsync -a --delete database/ outputs/infinityfree-htdocs-package/htdocs/database/
          rsync -a --delete resources/ outputs/infinityfree-htdocs-package/htdocs/resources/
          rsync -a --delete routes/ outputs/infinityfree-htdocs-package/htdocs/routes/
          rsync -a --delete deployment/ outputs/infinityfree-htdocs-package/htdocs/deployment/
          cp README.md outputs/infinityfree-htdocs-package/htdocs/README.md

      - name: Write production database config
        run: |
          cat > outputs/infinityfree-htdocs-package/htdocs/config/database.php <<'PHP'
          <?php

          declare(strict_types=1);

          return [
              'driver' => 'mysql',
              'host' => '${{ secrets.INFINITYFREE_DB_HOST }}',
              'port' => '3306',
              'database' => '${{ secrets.INFINITYFREE_DB_DATABASE }}',
              'username' => '${{ secrets.INFINITYFREE_DB_USERNAME }}',
              'password' => '${{ secrets.INFINITYFREE_DB_PASSWORD }}',
              'charset' => 'utf8mb4',
              'collation' => 'utf8mb4_unicode_ci',
          ];
          PHP

      - name: Upload htdocs package by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_SERVER }}
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: outputs/infinityfree-htdocs-package/htdocs/
          server-dir: htdocs/
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            assets/uploads/**
